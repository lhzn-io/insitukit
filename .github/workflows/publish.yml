name: Publish to PyPI

# Pushing a tag vX.Y.Z builds the sdist and wheel and publishes them to PyPI through trusted publishing (OIDC): no API
# token is stored anywhere. PyPI must list this repository, this workflow file and the `pypi` environment as a
# trusted publisher for insitukit.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches both version strings
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/insitukit/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$init" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, pyproject.toml $version and __version__ $init must agree" >&2
            exit 1
          fi

      - name: Test
        run: uv sync --dev --all-extras && uv run pytest

      - name: Build
        run: uv build

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/insitukit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
